name: Code Quality

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  # ============================================
  # PRETTIER CHECK
  # ============================================
  prettier:
    name: 💅 Format Check
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📥 Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: 📥 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 💅 Check Backend Format
        working-directory: ./backend
        run: npm run format:check

      - name: 💅 Check Frontend Format
        working-directory: ./frontend
        run: npm run format:check

  # ============================================
  # ESLINT
  # ============================================
  eslint:
    name: 🔍 ESLint
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📥 Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: 📥 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🔍 Lint Backend
        working-directory: ./backend
        run: npm run lint -- --format json --output-file eslint-backend.json
        continue-on-error: true

      - name: 🔍 Lint Frontend
        working-directory: ./frontend
        run: npm run lint -- --format json --output-file eslint-frontend.json
        continue-on-error: true

      - name: 📊 Upload ESLint Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eslint-results
          path: |
            backend/eslint-backend.json
            frontend/eslint-frontend.json

  # ============================================
  # COMPLEXITY ANALYSIS
  # ============================================
  complexity:
    name: 📊 Code Complexity
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📥 Install Dependencies
        run: npm install -g complexity-report

      - name: 📊 Analyze Backend Complexity
        run: |
          cr backend/src/**/*.ts --format json > complexity-backend.json || true
        continue-on-error: true

      - name: 📊 Analyze Frontend Complexity
        run: |
          cr frontend/src/**/*.tsx frontend/src/**/*.ts --format json > complexity-frontend.json || true
        continue-on-error: true

      - name: 📊 Upload Complexity Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complexity-results
          path: |
            complexity-backend.json
            complexity-frontend.json

  # ============================================
  # BUNDLE SIZE
  # ============================================
  bundle-size:
    name: 📦 Bundle Size Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📥 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🏗️ Build Frontend
        working-directory: ./frontend
        env:
          VITE_API_URL: http://localhost:4000/api
        run: npm run build

      - name: 📊 Analyze Bundle
        working-directory: ./frontend
        run: |
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          du -sh dist/* | sort -h >> $GITHUB_STEP_SUMMARY
          
      - name: 💬 Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            
            const bundleSize = execSync('du -sh frontend/dist').toString();
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📦 Bundle Size\n\n\`\`\`\n${bundleSize}\n\`\`\``
            })

  # ============================================
  # DUPLICATE CODE DETECTION
  # ============================================
  duplication:
    name: 🔄 Duplicate Code Check
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Check for Duplicates
        uses: platisd/duplicate-code-detection-tool@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          directories: "backend/src,frontend/src"
          file_extensions: "ts,tsx"
          ignore_directories: "node_modules,dist,build"
          
  # ============================================
  # CODACY COVERAGE REPORTER
  # ============================================
  coverage-report:
    name: 📊 Coverage Report
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📊 Run Codacy Coverage Reporter
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: backend/coverage/lcov.info,frontend/coverage/lcov.info
